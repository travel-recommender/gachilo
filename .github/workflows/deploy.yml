name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 건 끝내고 다음 것을 올린다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build static export
        # 프로젝트 페이지는 /<repo>/ 아래에 붙으므로 basePath가 필요하다.
        # 레포 이름이 바뀌어도 따라가도록 GITHUB_REPOSITORY에서 직접 뽑는다
        # (github.event.repository는 이벤트 종류에 따라 비어 있을 수 있다)
        run: |
          export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          echo "basePath = $NEXT_PUBLIC_BASE_PATH"
          npm run build

      - name: Disable Jekyll
        # 이게 없으면 GitHub Pages가 _next 폴더를 통째로 무시한다
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
